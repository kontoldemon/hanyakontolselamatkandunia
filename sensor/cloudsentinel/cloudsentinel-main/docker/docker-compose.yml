---
volumes:
  cloudsentinel-etc:
  cloudsentinel-var:
  cloudsentinel-clickhouse:

services:
  cloudsentinel:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - clickhouse
      - socketio
    ports:
      - "22:2222"
      - "2223:2223"
    environment:
      CLOUDSENTINEL_HONEYPOT_SENSOR_NAME: CloudSentinel
      CLOUDSENTINEL_HONEYPOT_HOSTNAME: usas-prod-srv-01
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_URL: http://clickhouse:8123
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_DATABASE: default
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_TABLE: cloudsentinel_events
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_LIVE_STREAM_ENABLED: "true"
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_LIVE_STREAM_URL: http://socketio:3001/events
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_FIREWALL_ENABLED: "false"
      CLOUDSENTINEL_OUTPUT_CLICKHOUSE_FIREWALL_DRY_RUN: "true"
    volumes:
      - cloudsentinel-etc:/cloudsentinel/cloudsentinel-git/etc
      - cloudsentinel-var:/cloudsentinel/cloudsentinel-git/var

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - cloudsentinel-clickhouse:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  socketio:
    build:
      context: ./socketio
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
