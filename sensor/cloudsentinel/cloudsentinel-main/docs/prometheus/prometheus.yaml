---
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: 'cloudsentinel'
    static_configs:
      - targets: [
        'cloudsentinel:9000',
      ]
  - job_name: 'scrapers'
    static_configs:
      - targets: [
        'node-exporter:9100',
        'cadvisor:8080'
      ]
    metric_relabel_configs:
      - source_labels: [cloudsentinel]
        regex: '^cloudsentinel$'
        action: keep
      - action: drop
        regex: '.*'
