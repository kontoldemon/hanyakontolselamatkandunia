# ============================================================================
# CloudSentinel Sensor Configuration
# Overrides cloudsentinel.cfg.dist and cloudsentinel.cfg defaults.
# Place at: /etc/cloudsentinel/cloudsentinel.cfg or ./cloudsentinel.cfg
# ============================================================================

[honeypot]
# Sensor identity
sensor_name = CloudSentinel
hostname = usas-prod-srv-01
log_path = var/log/cloudsentinel
state_path = var/lib/cloudsentinel
download_path = ${honeypot:state_path}/downloads
contents_path = honeyfs
ttylog = true
idle_timeout = 180
authentication_timeout = 120
backend = shell
logtype = rotating
timezone = UTC

# Auth (honeypot mode: accept all)
auth_class = UserDB
auth_none_enabled = true

# ============================================================================
# SSH Service (asyncssh)
# ============================================================================
[ssh]
enabled = true
listen_port = 2222

# Banner version string (presented to connecting clients)
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# Ciphers (in order of preference)
ciphers = aes256-ctr,aes192-ctr,aes128-ctr,aes256-cbc,aes192-cbc,aes128-cbc

# MACs
macs = hmac-sha2-256,hmac-sha2-512,hmac-sha1

# Compression
compression = none,zlib@openssh.com

# Authentication
auth_none_enabled = true
auth_keyboard_interactive_enabled = false
public_key_auth = ssh-rsa,ecdsa-sha2-nistp256,ssh-ed25519

# ============================================================================
# Output: JSON Log
# ============================================================================
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cloudsentinel.json

# ============================================================================
# Output: ClickHouse (CloudSentinel analytics engine)
# ============================================================================
[output_clickhouse]
enabled = true
url = http://127.0.0.1:8123
database = default
table = cloudsentinel_events
batch_size = 20
flush_interval = 5
max_queue = 1000
timeout = 10
debug = false

# SOAR (Security Orchestration, Automation, and Response)
soar_enabled = true
risk_threshold = 70

# Firewall blocking (Phase 1: local iptables)
firewall_enabled = true
firewall_dry_run = true
firewall_path = /sbin/iptables
