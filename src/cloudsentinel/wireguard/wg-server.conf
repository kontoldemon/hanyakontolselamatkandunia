# CloudSentinel WireGuard Server (Sensor Side)
# Encrypted management tunnel between sensor (DO/AWS) and dashboard.
# All ClickHouse queries and admin API calls go through this tunnel.

[Interface]
PrivateKey = <SENSOR_PRIVATE_KEY>
Address = 10.99.0.1/24
ListenPort = 51820

# PostUp: start CloudSentinel sensor bound to tunnel IP
PostUp = systemctl start cloudsentinel || true
PostDown = systemctl stop cloudsentinel || true

# Dashboard peer
[Peer]
PublicKey = <DASHBOARD_PUBLIC_KEY>
AllowedIPs = 10.99.0.2/32
PersistentKeepalive = 25
