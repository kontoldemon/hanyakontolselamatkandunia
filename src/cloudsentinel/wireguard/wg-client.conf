# CloudSentinel WireGuard Client (Dashboard Side)
# Connects to the sensor WireGuard tunnel for secure ClickHouse/admin access.

[Interface]
PrivateKey = <DASHBOARD_PRIVATE_KEY>
Address = 10.99.0.2/24
DNS = 1.1.1.1

[Peer]
PublicKey = <SENSOR_PUBLIC_KEY>
Endpoint = <SENSOR_PUBLIC_IP>:51820
AllowedIPs = 10.99.0.0/24
PersistentKeepalive = 25
