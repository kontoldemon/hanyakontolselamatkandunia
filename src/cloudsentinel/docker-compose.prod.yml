# CloudSentinel Production Override — DO Droplet deployment
# Usage: docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml up -d
# This override exposes port 22 directly, enables TLS, adds nginx, and runs the
# host-agent container in the host network namespace so iptables blocks the VM.

services:
  cloudsentinel:
    profiles: ["default", "dev", "prod"]
    ports:
      - "22:2222"          # Expose honeypot on real SSH port
    environment:
      SOAR_ACTIVE_PROFILE: production
      SOAR_FIREWALL_DRY_RUN: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in src/cloudsentinel/.env}
      CLICKHOUSE_ENABLED: "true"
      STREAM_ENABLED: "true"
      STREAM_CORS_ORIGIN: ${STREAM_CORS_ORIGIN:-https://dashboard-six-mu-20.vercel.app}
      ADMIN_ENABLED: "true"
      OBSERVABILITY_ENABLED: "true"
      OTEL_CONSOLE_EXPORTER: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-plain:
    profiles: ["default", "dev", "prod"]
    ports:
      - "127.0.0.1:6379:6379"

  nginx:
    profiles: ["default", "dev", "prod"]
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../var/lib/cloudsentinel/tls:/etc/nginx/certs:ro
    depends_on:
      - cloudsentinel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    profiles: ["default", "dev", "prod"]
    image: prom/prometheus:v3.0.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - cloudsentinel-prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  grafana:
    profiles: ["default", "dev", "prod"]
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - cloudsentinel-grafana:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

  host-agent:
    profiles: ["prod"]
    build:
      context: ../..
      dockerfile: deploy/host-agent.Dockerfile
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - python
      - /app/iptables_worker.py
      - --redis
      - redis://:${REDIS_PASSWORD:-cloudsentinel_redis}@127.0.0.1:6379/0
      - --firewall-path
      - /sbin/iptables
    depends_on:
      - redis-plain
    restart: unless-stopped

volumes:
  cloudsentinel-prometheus:
  cloudsentinel-grafana:
