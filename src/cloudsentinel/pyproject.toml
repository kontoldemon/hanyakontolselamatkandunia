[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I",    # pyflakes + isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "ASYNC",           # flake8-async
    "SIM",             # flake8-simplify
    "C4",              # flake8-comprehensions
    "RUF",             # ruff-specific
    "N",               # pep8-naming
    "PLC", "PLE",      # pylint
    "RSE",             # flake8-raise
    "T20",             # flake8-print (no print() in production)
    "PT",              # flake8-pytest-style
    "RET",             # flake8-return
    "ARG",             # flake8-unused-arguments
    "PTH",             # flake8-use-pathlib
    "ERA",             # eradicate (no commented-out code)
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=cloudsentinel --cov-report=term-missing --cov-report=html --cov-fail-under=90 -n auto"

[tool.coverage.run]
source = ["cloudsentinel"]
omit = ["tests/*"]
