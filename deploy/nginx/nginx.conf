events { worker_connections 1024; }

http {
    # Rate limiting: 10 req/s per IP for admin API
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=stream:10m rate=50r/s;

    # Upstream to CloudSentinel
    upstream cloudsentinel_admin {
        server cloudsentinel:8080;
    }
    upstream cloudsentinel_stream {
        server cloudsentinel:3001;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/usas-prod-srv-01.crt;
        ssl_certificate_key /etc/nginx/certs/usas-prod-srv-01.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Admin API
        location / {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://cloudsentinel_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # WebSocket stream
        location /socket.io/ {
            limit_req zone=stream burst=100 nodelay;
            proxy_pass http://cloudsentinel_stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Health check (no rate limit)
        location /healthz {
            proxy_pass http://cloudsentinel_admin;
            proxy_set_header Host $host;
        }

        # Metrics (internal only)
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://cloudsentinel_admin;
        }
    }
}
