apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudsentinel.fullname" . }}-secrets
  labels: {{- include "cloudsentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUDSENTINEL_AUTH_SECRET: {{ .Values.config.authSecret | default (randAlphaNum 32) | quote }}
  CLOUDSENTINEL_CLICKHOUSE_PASSWORD: {{ .Values.config.clickhouse.password | default "" | quote }}
  CLOUDSENTINEL_ES_API_KEY: {{ .Values.config.elasticsearch.apiKey | default "" | quote }}
  CLOUDSENTINEL_MISP_API_KEY: {{ .Values.config.misp.apiKey | default "" | quote }}
  CLOUDSENTINEL_ABUSEIPDB_KEY: {{ .Values.config.abuseipdb.apiKey | default "" | quote }}
  LLM_API_KEY: {{ .Values.config.llmApiKey | default "" | quote }}
  CLOUDSENTINEL_SLACK_WEBHOOK: {{ .Values.config.slackWebhook | default "" | quote }}
  CLOUDSENTINEL_DISCORD_WEBHOOK: {{ .Values.config.discordWebhook | default "" | quote }}
  CLOUDSENTINEL_TELEGRAM_BOT_TOKEN: {{ .Values.config.telegramBotToken | default "" | quote }}
