apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudsentinel.fullname" . }}
  labels: {{- include "cloudsentinel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: {{ .Values.service.ssh.port }}
      targetPort: ssh
      protocol: TCP
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
    - name: stream
      port: {{ .Values.service.stream.port }}
      targetPort: stream
      protocol: TCP
  selector: {{- include "cloudsentinel.selectorLabels" . | nindent 4 }}
