global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: cloudsentinel
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudsentinel:8080"]
    scrape_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
