name: CloudSentinel CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'artifacts/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sensor/cloudsentinel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format check)
        run: ruff format --check .
      - name: mypy (type check)
        run: mypy cloudsentinel/ --ignore-missing-imports || true
      - name: bandit (SAST)
        run: bandit -r cloudsentinel/ -c pyproject.toml -f sarif -o bandit-results.sarif || true
        continue-on-error: true
      - name: Upload SAST results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sensor/cloudsentinel/bandit-results.sarif
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sensor/cloudsentinel
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v             --cov=cloudsentinel             --cov-report=term-missing             --cov-report=xml:coverage.xml             --cov-fail-under=60             --timeout=30             -p no:warnings
        env:
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: sensor/cloudsentinel/coverage.xml
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-24.04
    needs: [lint, test]
    defaults:
      run:
        working-directory: sensor/cloudsentinel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: sensor/cloudsentinel
          load: true
          tags: cloudsentinel:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudsentinel:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sensor/cloudsentinel/trivy-results.sarif
        continue-on-error: true

  publish:
    name: Publish Container
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker]
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: sensor/cloudsentinel
    steps:
      - uses: actions/checkout@v4
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sensor/cloudsentinel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fyp_project/mockup/cloud_sentinel_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fyp_project/mockup/cloud_sentinel_ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint || true
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: cloudsentinel-ui
          path: fyp_project/mockup/cloud_sentinel_ui/out/

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/cloudsentinel/ || true
        continue-on-error: true
