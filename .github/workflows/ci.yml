name: CloudSentinel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/cloudsentinel/requirements.txt

      - name: Install dependencies
        run: pip install -r src/cloudsentinel/requirements.txt ruff mypy

      - name: Ruff critical lint
        run: ruff check src/cloudsentinel --select E9,F63,F7,F82

      - name: Python import smoke test
        run: python -m compileall -q src/cloudsentinel

      - name: Mypy type check (advisory)
        run: mypy src/cloudsentinel --ignore-missing-imports
        continue-on-error: true
        env:
          PYTHONPATH: src

  test:
    name: Unit Tests (Python 3.12)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/cloudsentinel/requirements.txt

      - name: Install dependencies
        run: pip install -r src/cloudsentinel/requirements.txt

      - name: Run unit tests
        run: pytest src/cloudsentinel/tests/test_stage1.py -v --cov=cloudsentinel --cov-report=term-missing --cov-fail-under=25 --timeout=60 -o addopts=""
        env:
          PYTHONPATH: src
          REDIS_URL: redis://localhost:6379/0

      - name: Run MTTB benchmark (dry-run)
        run: python -m cloudsentinel.mttb_benchmark --iterations 3 --delay 0.02 --redis-url redis://localhost:6379/0
        env:
          PYTHONPATH: src
          REDIS_URL: redis://localhost:6379/0

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/cloudsentinel
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cloudsentinel:ci .
      - name: Verify image
        run: docker run --rm cloudsentinel:ci python -c "from cloudsentinel.config import Settings; print('OK')"

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
